spring.application.name=maviina-mane-api

spring.config.import=optional:file:./.env[.properties]

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/maviina_mane}

app.cors-origin=${CORS_ORIGIN:http://localhost:3000,http://localhost:3001}

server.error.include-message=never

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

app.jwt-secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}

app.upload-dir=${UPLOAD_DIR:uploads}

app.google-maps-api-key=${GOOGLE_MAPS_API_KEY:}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}

app.upload-max-bytes=${UPLOAD_MAX_BYTES:10485760}
